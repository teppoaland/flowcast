<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowCast {{ app_version }} — Käynnistyy...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1a1a2e;
            color: #eee;
            font-family: system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .loader-box {
            text-align: center;
        }

        .loader-box h1 {
            font-size: 1.6rem;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .version-badge {
            font-size: 0.75rem;
            font-weight: 600;
            color: #888;
            margin-left: 4px;
        }

        .loader-box p {
            font-size: 1rem;
            color: #888;
            margin-bottom: 32px;
        }

        .dots {
            display: inline-flex;
            gap: 6px;
        }

        .dots span {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e94560;
            animation: bounce 1.4s ease-in-out infinite both;
        }

        .dots span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dots span:nth-child(2) {
            animation-delay: -0.16s;
        }

        .dots span:nth-child(3) {
            animation-delay: 0s;
        }

        @keyframes bounce {
            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .status {
            font-size: 0.8rem;
            color: #555;
            margin-top: 28px;
        }
    </style>
</head>

<body>
    <div class="loader-box">
        <h1>FlowCast <span class="version-badge">{{ app_version }}</span></h1>
        <p>Palvelu käynnistyy</p>
        <div class="dots">
            <span></span><span></span><span></span>
        </div>
        <div class="status" id="status"></div>
    </div>

    <script>
        var startTime = Date.now();
        var minShowMs = 1500; // näytä vähintään 1,5 s
        var attempt = 0;
        var maxAttempts = 60; // 60 * 500ms = 30s max
        var serverReady = false;

        function doRedirect() {
            var elapsed = Date.now() - startTime;
            var delay = Math.max(0, minShowMs - elapsed);
            setTimeout(function() {
                window.location.href = '/adminpanel';
            }, delay);
        }

        function tryConnect() {
            attempt++;
            fetch('/api/ping')
                .then(function(r) {
                    if (r.ok) {
                        serverReady = true;
                        doRedirect();
                    } else if (attempt < maxAttempts) {
                        setTimeout(tryConnect, 500);
                    } else {
                        document.getElementById('status').textContent =
                            'Palvelu ei vastaa. Yritä uudelleen hetken kuluttua.';
                    }
                })
                .catch(function() {
                    if (attempt < maxAttempts) {
                        setTimeout(tryConnect, 500);
                    } else {
                        document.getElementById('status').textContent =
                            'Palvelu ei vastaa. Yritä uudelleen hetken kuluttua.';
                    }
                });
        }

        tryConnect();
    </script>
</body>

</html>
